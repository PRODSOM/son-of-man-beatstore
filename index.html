<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Son of Man Beatstore</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }

    body, html {
      height:100%;
      font-family:'Playfair Display', serif;
      color:white;
      background:black;
    }

    .landing {
      height:100vh;
      background:url('landing.gif') no-repeat center/cover;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-direction:column;
      text-align:center;
    }

    .landing h1 {
      font-family:'Cinzel', serif;
      font-size:4rem;
      text-shadow:0 0 25px rgba(255,255,255,0.7);
    }

    .landing-message {
      margin-top:15px;
      font-size:1.2rem;
      opacity:0.9;
    }

    .enter-btn {
      margin-top:30px;
      padding:15px 40px;
      border-radius:30px;
      border:1px solid white;
      background:rgba(0,0,0,0.4);
      color:white;
      cursor:pointer;
      transition:0.3s;
    }

    .enter-btn:hover {
      transform:scale(1.05);
      box-shadow:0 0 20px white;
    }

    .main {
      display:none;
      min-height:100vh;
      background:url('main.gif') no-repeat center/cover;
      padding:60px 30px 120px;
    }

    .header {
      text-align:center;
    }

    .header h1 {
      font-family:'Cinzel', serif;
      font-size:3rem;
      text-shadow:0 0 25px rgba(255,255,255,0.7);
    }

    .main-message {
      text-align:center;
      margin-top:20px;
      font-size:1.1rem;
      opacity:0.9;
    }

    .beats {
      margin-top:60px;
      display:flex;
      justify-content:center;
    }

    .beat-card {
      width:320px;
      padding:25px;
      border-radius:15px;
      background:rgba(0,0,0,0.5);
      backdrop-filter:blur(10px);
      text-align:center;
    }

    .beat-title {
      font-size:1.6rem;
      margin-bottom:20px;
    }

    audio {
      width:100%;
      margin-bottom:20px;
    }

    .buy-btn {
      width:100%;
      padding:12px;
      border-radius:30px;
      border:1px solid white;
      background:transparent;
      color:white;
      cursor:pointer;
    }

    .buy-btn:hover {
      box-shadow:0 0 20px white;
    }

    .instagram-footer {
      position:fixed;
      bottom:15px;
      left:15px;
      font-size:0.9rem;
      opacity:0.8;
    }

    .instagram-footer a {
      color:white;
      text-decoration:none;
    }
  </style>
</head>

<body>

<div class="landing" id="landing">
  <h1>Son of Man</h1>
  <div class="landing-message">✨The Sound of Nights in Africa✨</div>
  <button class="enter-btn" onclick="enterSite()">Enter</button>
</div>

<div class="main" id="main">

  <div class="header">
    <h1>Son of Man<br>Beatstore</h1>
  </div>

  <div class="main-message">
    ✨Welcome to the Night✨<br>
    Unlock the Sounds Made For You.
  </div>

  <div class="beats">

    <div class="beat-card">
      <div class="beat-title">Home</div>

      <audio controls>
        <source src="home-preview.mp3" type="audio/mpeg">
      </audio>

      <a href="home-buy.html">
        <button class="buy-btn">Unlock Beat — $10</button>
      </a>
    </div>

  </div>

  <div class="instagram-footer">
    <a href="https://instagram.com/sonofman_sound" target="_blank">
      instagram.com/sonofman_sound
    </a><br>
    DM for any issues or questions.
  </div>

</div>

<script>
function enterSite() {
  document.getElementById('landing').style.display = 'none';
  document.getElementById('main').style.display = 'block';
}
</script>

</body>
</html>
