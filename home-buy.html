<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Home - Purchase</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">

<style>
* {
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body {
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:url('beat-landing.gif') no-repeat center/cover;
  font-family:'Playfair Display', serif;
  color:white;
  position:relative;
}

/* CLEAN DARK OVERLAY (NO BLUR) */
body::before {
  content:"";
  position:absolute;
  inset:0;
  background:rgba(0,0,0,0.65);
}

/* MAIN CARD */
.container {
  position:relative;
  z-index:2;
  width:340px;
  padding:50px 35px;
  border-radius:25px;
  background:rgba(0,0,0,0.45);
  backdrop-filter:blur(10px);
  border:1px solid rgba(255,255,255,0.1);
  text-align:center;
  box-shadow:0 0 40px rgba(0,0,0,0.6);
  animation:fadeUp 1s ease;
}

/* BRAND */
h1 {
  font-family:'Cinzel', serif;
  font-size:2.5rem;
  margin-bottom:6px;
  text-shadow:
    0 0 10px rgba(255,255,255,0.6),
    0 0 25px rgba(255,255,255,0.3);
}

/* 🔥 BEAT NAME (NOW PREMIUM GLOW) */
.beat-name {
  font-size:1.5rem;
  margin-bottom:25px;
  letter-spacing:1px;
  text-shadow:
    0 0 12px rgba(255,255,255,0.9),
    0 0 25px rgba(255,255,255,0.5),
    0 0 50px rgba(255,255,255,0.25);
  animation:glowPulse 3.5s ease-in-out infinite;
}

/* AUDIO */
audio {
  width:100%;
  margin-bottom:30px;
  opacity:0.95;
}

/* PRIMARY BUTTON */
.buy-btn {
  display:block;
  width:100%;
  padding:15px;
  border-radius:40px;
  border:1px solid rgba(255,255,255,0.6);
  background:rgba(255,255,255,0.06);
  color:white;
  text-decoration:none;
  font-size:1rem;
  letter-spacing:1px;
  transition:0.35s ease;
  margin-bottom:18px;
}

.buy-btn:hover {
  transform:scale(1.06);
  box-shadow:
    0 0 25px rgba(255,255,255,0.35),
    0 0 60px rgba(255,255,255,0.2);
}

/* SUBTLE BACK LINK */
.back-btn {
  display:inline-block;
  font-size:0.75rem;
  opacity:0.5;
  color:white;
  text-decoration:none;
  transition:0.3s;
}

.back-btn:hover {
  opacity:0.9;
  text-shadow:0 0 10px rgba(255,255,255,0.4);
}

/* FOOTER */
.footer {
  position:absolute;
  bottom:18px;
  left:20px;
  font-size:0.85rem;
  opacity:0.7;
  line-height:1.5;
  z-index:3;
}

.footer a {
  color:white;
  text-decoration:none;
}

/* ANIMATIONS */
@keyframes fadeUp {
  from {
    opacity:0;
    transform:translateY(20px);
  }
  to {
    opacity:1;
    transform:translateY(0);
  }
}

@keyframes glowPulse {
  0% {
    text-shadow:
      0 0 10px rgba(255,255,255,0.7),
      0 0 25px rgba(255,255,255,0.4);
  }
  50% {
    text-shadow:
      0 0 18px rgba(255,255,255,1),
      0 0 45px rgba(255,255,255,0.6),
      0 0 70px rgba(255,255,255,0.3);
  }
  100% {
    text-shadow:
      0 0 10px rgba(255,255,255,0.7),
      0 0 25px rgba(255,255,255,0.4);
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Son of Man</h1>

  <div class="beat-name">Home</div>

  <audio controls>
    <source src="home-preview.mp3" type="audio/mpeg">
  </audio>

  <a class="buy-btn" href="https://www.paypal.com/cgi-bin/webscr?cmd=_xclick&business=YOUR-PAYPAL-EMAIL&item_name=Home Beat&amount=10&currency_code=USD&return=https://prodsom.github.io/son-of-man-beatstore/home-download.html">
    Purchase — $10
  </a>

  <a class="back-btn" href="index.html">Return to store</a>
</div>

<div class="footer">
  <a href="https://instagram.com/sonofman_sound" target="_blank">
    instagram.com/sonofman_sound
  </a><br>
  DM for any issues or questions.
</div>

</body>
</html>
